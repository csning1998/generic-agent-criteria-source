[project]
name = "skills-xai-supergrok"
version = "0.1.0"
description = "Owner Grok skills, hooks, and Second Brain documentation."
readme = "README-Repository.md"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["hooks"]
include = ["engineering_principles*", "adapter_install*"]

[tool.ruff]
# Specify the target Python version
target-version = "py311"

# Limit line length to 80 characters per Google Style Guide
line-length = 80

# Exclude directories that do not require checking
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "bundled",
  "marketplace-cache",
  "vendor",
  "sessions",
  "downloads",
  "logs",
  "memtrace",
]

[tool.ruff.lint]
# Enable rule sets for Google Python Style Guide alignment
# E, W: pycodestyle (PEP 8 basic styling)
# F: pyflakes (static error detection)
# I: isort (import sorting)
# D: pydocstyle (docstring checks)
select = ["E", "W", "F", "I", "D"]

# Ignore rules that are not strictly enforced
ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
# Enforce Google style docstrings
convention = "google"

[tool.ruff.lint.isort]
# Google Style: single line imports ordered alphabetically
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"hooks/bin/engineering-principles.py" = ["E402"]
"hooks/bin/install-adapters.py" = ["E402"]

[dependency-groups]
dev = ["ruff>=0.15.20", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
