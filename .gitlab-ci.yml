---
include:
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/core@1.6.0
    inputs:
      reviewer_image: $CI_REGISTRY/csning1998/gitlab-ci-with-code-reviewer/reviewer:1.6.0
      claude_model: claude-sonnet-5
      enable_sonarqube: true
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/iac-terraform@1.6.0
    inputs:
      # CKV_GLB_1, CKV_GLB_3, CKV_GLB_4: require GitLab Premium/Ultimate merge request approval and push rules.
      # CKV_TF_1: enforces commit-pinned Git URLs; modules use immutable semantic versions from GitLab Terraform Registry.
      checkov_skip: "CKV_GLB_1,CKV_GLB_3,CKV_GLB_4,CKV_TF_1"
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/lang-python@1.6.0
    inputs:
      package_manager: uv
      python_image: ghcr.io/astral-sh/uv:python3.11-alpine
      python_globs: ["hooks/**/*.py", "skills/**/*.py", "tests/**/*.py"]
      python_test_cmd: pytest
      test_stage: test
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/auto-tag@1.6.0
    inputs:
      reviewer_image: $CI_REGISTRY/csning1998/gitlab-ci-with-code-reviewer/reviewer:1.6.0
