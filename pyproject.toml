[project]
name = "generic-agent-criteria-source"
version = "0.1.0"
description = "Grok skills, hooks, and harness criteria."
readme = "README-Repository.md"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["hooks"]
include = ["engineering_principles*", "adapter_install*"]

[tool.ruff]
# Specify the target Python version
target-version = "py311"

# Limit line length to 80 characters per Google Style Guide
line-length = 80

# Exclude directories that do not require checking
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "bundled",
  "marketplace-cache",
  "vendor",
  "sessions",
  "downloads",
  "logs",
  "memtrace",
  "*.json",
]

[tool.ruff.lint]
# Rule selection: pycodestyle, pyflakes, isort, pydocstyle
select = ["E", "W", "F", "I", "D"]

# Ignored rules
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
# Enforce Google style docstrings
convention = "google"

[tool.ruff.lint.isort]
# Google Style: single line imports ordered alphabetically
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"hooks/bin/engineering-principles.py" = ["E402"]
"hooks/bin/install-adapters.py" = ["E402"]
"tests/test_lexicon_consistency.py" = ["E501"]
"**/*.json" = ["E501", "F821"]

[dependency-groups]
dev = ["ruff>=0.15.20", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = [
  "hooks",
  "hooks/adapters/claude",
  "skills/skill-module-gitlab-mr-labels/scripts",
  "skills/skill-update-antigravity/scripts",
]
